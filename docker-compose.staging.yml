# ==============================================================================
# FANCYPERU — Private Staging Docker Compose Specification
# Target Host: servidor-1 (192.168.1.36)
# Environment: Isolated Private Staging (No public internet exposure)
# Memory Footprint Target: < 1.5 GB Limit / ~600 MB Reservation
# ==============================================================================

version: "3.8"

networks:
  staging-fancyperu-net:
    driver: bridge
    name: staging-fancyperu-net

volumes:
  staging_fancyperu_db_data:
    name: staging_fancyperu_db_data
  staging_fancyperu_redis_data:
    name: staging_fancyperu_redis_data
  staging_fancyperu_minio_data:
    name: staging_fancyperu_minio_data
  staging_fancyperu_uploads:
    name: staging_fancyperu_uploads

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Staging Database (Isolated, No Host Port)
  # ----------------------------------------------------------------------------
  staging-fancyperu-db:
    image: postgres:16-alpine
    container_name: staging-fancyperu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fancyperu_staging}
      POSTGRES_USER: ${POSTGRES_USER:-fancyperu_staging_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - staging_fancyperu_db_data:/var/lib/postgresql/data
    networks:
      - staging-fancyperu-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fancyperu_staging_admin} -d $${POSTGRES_DB:-fancyperu_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Staging Instance (Isolated, No Host Port)
  # ----------------------------------------------------------------------------
  staging-fancyperu-redis:
    image: redis:7-alpine
    container_name: staging-fancyperu-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 96mb
      --maxmemory-policy noeviction
    volumes:
      - staging_fancyperu_redis_data:/data
    networks:
      - staging-fancyperu-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          memory: 32M

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Staging Storage
  # Pinned Image: elestio/minio:RELEASE.2025-09-07T16-13-09Z
  # Console strictly bound to 127.0.0.1 (not published externally)
  # ----------------------------------------------------------------------------
  staging-fancyperu-minio:
    image: elestio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: staging-fancyperu-minio
    restart: unless-stopped
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://${STAGING_HOST_IP:-192.168.1.36}:${MINIO_PORT:-9002}
    ports:
      - "${STAGING_BIND_IP:-192.168.1.36}:${MINIO_PORT:-9002}:9000"
    volumes:
      - staging_fancyperu_minio_data:/data
    networks:
      - staging-fancyperu-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 4. Medusa Staging Migrations Runner
  # One-shot container to execute db:migrate before backend starts
  # ----------------------------------------------------------------------------
  staging-fancyperu-migration:
    image: ${BACKEND_IMAGE:-fancyperu-backend:staging}
    container_name: staging-fancyperu-migration
    restart: "no"
    depends_on:
      staging-fancyperu-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_staging_admin}:${POSTGRES_PASSWORD}@staging-fancyperu-db:5432/${POSTGRES_DB:-fancyperu_staging}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      S3_BUCKET: ${S3_BUCKET:-fancyperu-staging-media}
      S3_ENDPOINT: http://staging-fancyperu-minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["node", "../../node_modules/@medusajs/cli/cli.js", "db:migrate"]
    networks:
      - staging-fancyperu-net

  # ----------------------------------------------------------------------------
  # 5. Medusa 2.21.2 Backend API & Admin Dashboard (Private Staging)
  # ----------------------------------------------------------------------------
  staging-fancyperu-backend:
    image: ${BACKEND_IMAGE:-fancyperu-backend:staging}
    container_name: staging-fancyperu-backend
    restart: unless-stopped
    depends_on:
      staging-fancyperu-db:
        condition: service_healthy
      staging-fancyperu-redis:
        condition: service_healthy
      staging-fancyperu-migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_staging_admin}:${POSTGRES_PASSWORD}@staging-fancyperu-db:5432/${POSTGRES_DB:-fancyperu_staging}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@staging-fancyperu-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      STORE_CORS: http://${STAGING_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}
      ADMIN_CORS: http://${STAGING_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      AUTH_CORS: http://${STAGING_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099},http://${STAGING_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      MEDUSA_BACKEND_URL: http://${STAGING_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      S3_ENDPOINT: http://staging-fancyperu-minio:9000
      S3_BUCKET: ${S3_BUCKET:-fancyperu-staging-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-staging-private}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FILE_URL: http://${STAGING_HOST_IP:-192.168.1.36}:${MINIO_PORT:-9002}/${S3_BUCKET:-fancyperu-staging-media}
    ports:
      - "${STAGING_BIND_IP:-192.168.1.36}:${BACKEND_PORT:-9095}:9000"
    volumes:
      - staging_fancyperu_uploads:/app/apps/backend/uploads
    networks:
      - staging-fancyperu-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. Next.js 15 Standalone Storefront (Private Staging)
  # ----------------------------------------------------------------------------
  staging-fancyperu-storefront:
    image: ${STOREFRONT_IMAGE:-fancyperu-storefront:staging}
    container_name: staging-fancyperu-storefront
    restart: unless-stopped
    depends_on:
      staging-fancyperu-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      MEDUSA_BACKEND_URL: http://staging-fancyperu-backend:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://${STAGING_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEFAULT_REGION: pe
      NEXT_PUBLIC_BASE_URL: http://${STAGING_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}
      NEXT_PUBLIC_ENVIRONMENT: staging
      STAGING: "true"
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - "${STAGING_BIND_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}:8000"
    networks:
      - staging-fancyperu-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
