# ==============================================================================
# FANCYPETS / FANCYPERU — Production Docker Compose Specification
# Target Host: servidor-1 (192.168.1.36)
# Project Name: FancyPets Production
# Isolation: Dedicated isolated bridge network & dedicated named volumes
# Management: Coolify 4.4.6 Managed Service
# Memory Limit: < 1.5 GB Total Limit / ~600 MB Reservation
# ==============================================================================

version: "3.8"

networks:
  fancyperu-prod-net:
    driver: bridge
    name: fancyperu-prod-net

volumes:
  fancyperu_prod_db_data:
    name: fancyperu_prod_db_data
  fancyperu_prod_redis_data:
    name: fancyperu_prod_redis_data
  fancyperu_prod_minio_data:
    name: fancyperu_prod_minio_data
  fancyperu_prod_uploads:
    name: fancyperu_prod_uploads

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Dedicated Database (Zero Host Port Exposure)
  # ----------------------------------------------------------------------------
  fancyperu-prod-db:
    image: postgres:16-alpine
    container_name: fancyperu-prod-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fancyperu_production}
      POSTGRES_USER: ${POSTGRES_USER:-fancyperu_prod_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - fancyperu_prod_db_data:/var/lib/postgresql/data
    networks:
      - fancyperu-prod-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fancyperu_prod_admin} -d $${POSTGRES_DB:-fancyperu_production}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 2. Redis 7 Instance (No Host Port, BullMQ noeviction Policy)
  # ----------------------------------------------------------------------------
  fancyperu-prod-redis:
    image: redis:7-alpine
    container_name: fancyperu-prod-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - fancyperu_prod_redis_data:/data
    networks:
      - fancyperu-prod-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 128M
        reservations:
          memory: 32M

  # ----------------------------------------------------------------------------
  # 3. MinIO S3 Dedicated Storage (Console Isolated to 127.0.0.1)
  # ----------------------------------------------------------------------------
  fancyperu-prod-minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fancyperu-prod-minio
    restart: unless-stopped
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: http://${PROD_HOST_IP:-192.168.1.36}:${MINIO_PORT:-9002}
    ports:
      - "${PROD_BIND_IP:-192.168.1.36}:${MINIO_PORT:-9002}:9000"
    volumes:
      - fancyperu_prod_minio_data:/data
    networks:
      - fancyperu-prod-net
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 4. Medusa Migrations One-Shot Runner
  # ----------------------------------------------------------------------------
  fancyperu-prod-migration:
    image: ${BACKEND_IMAGE:-fancyperu-backend:production-2.21.2-20261016}
    pull_policy: never
    container_name: fancyperu-prod-migration
    restart: "no"
    depends_on:
      fancyperu-prod-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_prod_admin}:${POSTGRES_PASSWORD}@fancyperu-prod-db:5432/${POSTGRES_DB:-fancyperu_production}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_ENDPOINT: http://fancyperu-prod-minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["node", "../../node_modules/@medusajs/cli/cli.js", "db:migrate"]
    networks:
      - fancyperu-prod-net

  # ----------------------------------------------------------------------------
  # 5. Medusa 2.21.2 Backend API & Admin Dashboard
  # ----------------------------------------------------------------------------
  fancyperu-prod-backend:
    image: ${BACKEND_IMAGE:-fancyperu-backend:production-2.21.2-20261016}
    pull_policy: never
    container_name: fancyperu-prod-backend
    restart: unless-stopped
    depends_on:
      fancyperu-prod-db:
        condition: service_healthy
      fancyperu-prod-redis:
        condition: service_healthy
      fancyperu-prod-migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_prod_admin}:${POSTGRES_PASSWORD}@fancyperu-prod-db:5432/${POSTGRES_DB:-fancyperu_production}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@fancyperu-prod-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      STORE_CORS: http://${PROD_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}
      ADMIN_CORS: http://${PROD_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      AUTH_CORS: http://${PROD_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099},http://${PROD_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      MEDUSA_BACKEND_URL: http://${PROD_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      S3_ENDPOINT: http://fancyperu-prod-minio:9000
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-private}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FILE_URL: http://${PROD_HOST_IP:-192.168.1.36}:${MINIO_PORT:-9002}/${S3_BUCKET:-fancyperu-media}
    ports:
      - "${PROD_BIND_IP:-192.168.1.36}:${BACKEND_PORT:-9095}:9000"
    volumes:
      - fancyperu_prod_uploads:/app/apps/backend/uploads
    networks:
      - fancyperu-prod-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 256M

  # ----------------------------------------------------------------------------
  # 6. Next.js 15 Standalone Storefront
  # ----------------------------------------------------------------------------
  fancyperu-prod-storefront:
    image: ${STOREFRONT_IMAGE:-fancyperu-storefront:production-15.5.24-20261016}
    pull_policy: never
    container_name: fancyperu-prod-storefront
    restart: unless-stopped
    depends_on:
      fancyperu-prod-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      MEDUSA_BACKEND_URL: http://fancyperu-prod-backend:9000
      MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: http://${PROD_HOST_IP:-192.168.1.36}:${BACKEND_PORT:-9095}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEFAULT_REGION: pe
      NEXT_PUBLIC_BASE_URL: http://${PROD_HOST_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}
      NEXT_PUBLIC_ENVIRONMENT: production
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    ports:
      - "${PROD_BIND_IP:-192.168.1.36}:${STOREFRONT_PORT:-8099}:8000"
    networks:
      - fancyperu-prod-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 128M
