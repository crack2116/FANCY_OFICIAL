# ==============================================================================
# GENERATED FILE - do not edit by hand.
# Source: docker-compose.dokploy.yml
# Regenerate: node deploy/dokploy/render-images-compose.mjs
#
# Use with Dokploy sourceType=raw after building the images on the host:
#   fancyperu-backend:dokploy
#   fancyperu-storefront:dokploy
# ==============================================================================
# ==============================================================================
# FANCYPERU — Dokploy production stack (Docker Compose)
# Target: 192.168.1.38 (Ubuntu 26.04, Dokploy + Traefik on dokploy-network)
# Public routing: Traefik (entrypoints web/websecure, resolver letsencrypt)
# Isolation: dedicated bridge network; only web-facing services join dokploy-network
# Data: dedicated PostgreSQL 16, Redis 7 and MinIO. Dokploy's own DB is NOT used.
#
# Deploy: Dokploy -> Project -> Docker Compose -> this file.
# Required: every variable in config/dokploy.env.example must be set.
# ==============================================================================

name: fancyperu

networks:
  fancyperu-internal:
    name: fancyperu-internal
    driver: bridge
  dokploy-network:
    external: true

volumes:
  fancyperu_db_data:
    name: fancyperu_db_data
  fancyperu_redis_data:
    name: fancyperu_redis_data
  fancyperu_minio_data:
    name: fancyperu_minio_data
  fancyperu_uploads:
    name: fancyperu_uploads

services:
  # ----------------------------------------------------------------------------
  # PostgreSQL 16 — dedicated, no host ports
  # ----------------------------------------------------------------------------
  fancyperu-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fancyperu_production}
      POSTGRES_USER: ${POSTGRES_USER:-fancyperu_prod_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - fancyperu_db_data:/var/lib/postgresql/data
    networks:
      - fancyperu-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { memory: 128M }

  # ----------------------------------------------------------------------------
  # Redis 7 — event bus, workflow engine, cache
  # ----------------------------------------------------------------------------
  fancyperu-redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - fancyperu_redis_data:/data
    networks:
      - fancyperu-internal
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 192M }
        reservations: { memory: 32M }

  # ----------------------------------------------------------------------------
  # MinIO — object storage. Console is loopback-only, API is routed by Traefik.
  # ----------------------------------------------------------------------------
  fancyperu-minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_SERVER_URL: ${PUBLIC_SCHEME:-https}://${S3_DOMAIN:?S3_DOMAIN is required}
    volumes:
      - fancyperu_minio_data:/data
    networks:
      - fancyperu-internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.fancyperu-s3.rule=Host(`${S3_DOMAIN:?S3_DOMAIN is required}`)"
      - "traefik.http.routers.fancyperu-s3.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fancyperu-s3.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.fancyperu-s3.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}"
      - "traefik.http.services.fancyperu-s3.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }
        reservations: { memory: 128M }

  # ----------------------------------------------------------------------------
  # MinIO bucket initialisation (one-shot, idempotent, never destructive)
  #  - fancyperu-media   : created if missing, anonymous READ ONLY
  #  - fancyperu-private : created if missing, no anonymous policy
  #  - never deletes buckets or objects
  #  - credentials are never echoed
  # ----------------------------------------------------------------------------
  fancyperu-minio-init:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    restart: "no"
    depends_on:
      fancyperu-minio:
        condition: service_healthy
    networks:
      - fancyperu-internal
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MEDIA_BUCKET: ${S3_BUCKET:-fancyperu-media}
      PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-private}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mc alias set local "http://fancyperu-minio:9000" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" >/dev/null
        mc mb --ignore-existing "local/$$MEDIA_BUCKET" >/dev/null
        mc anonymous set download "local/$$MEDIA_BUCKET" >/dev/null
        mc mb --ignore-existing "local/$$PRIVATE_BUCKET" >/dev/null
        mc anonymous set none "local/$$PRIVATE_BUCKET" >/dev/null
        echo "minio buckets ready: $$MEDIA_BUCKET (read-only public), $$PRIVATE_BUCKET (private)"
    logging:
      driver: json-file
      options: { max-size: "2m", max-file: "1" }
    deploy:
      resources:
        limits: { cpus: "0.2", memory: 128M }

  # ----------------------------------------------------------------------------
  # Medusa migrations (one-shot, must finish before backend/worker start)
  # ----------------------------------------------------------------------------
  fancyperu-migration:
    image: fancyperu-backend:dokploy
    restart: "no"
    depends_on:
      fancyperu-db:
        condition: service_healthy
      fancyperu-minio-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_prod_admin}:${POSTGRES_PASSWORD}@fancyperu-db:5432/${POSTGRES_DB:-fancyperu_production}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      MEDUSA_FF_RBAC: ${MEDUSA_FF_RBAC:-true}
      S3_ENDPOINT: http://fancyperu-minio:9000
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["node", "../../node_modules/@medusajs/cli/cli.js", "db:migrate"]
    networks:
      - fancyperu-internal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "2" }
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 768M }

  # ----------------------------------------------------------------------------
  # Medusa backend (API + admin dashboard at /app)
  # ----------------------------------------------------------------------------
  fancyperu-backend:
    image: fancyperu-backend:dokploy
    restart: unless-stopped
    depends_on:
      fancyperu-db:
        condition: service_healthy
      fancyperu-redis:
        condition: service_healthy
      fancyperu-migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 9000
      MEDUSA_WORKER_MODE: ${MEDUSA_WORKER_MODE:-shared}
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_prod_admin}:${POSTGRES_PASSWORD}@fancyperu-db:5432/${POSTGRES_DB:-fancyperu_production}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@fancyperu-redis:6379
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      COOKIE_SECRET: ${COOKIE_SECRET:?COOKIE_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      MEDUSA_FF_RBAC: ${MEDUSA_FF_RBAC:-true}
      STORE_CORS: ${STORE_CORS}
      ADMIN_CORS: ${ADMIN_CORS}
      AUTH_CORS: ${AUTH_CORS}
      MEDUSA_BACKEND_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}
      STOREFRONT_URL: ${PUBLIC_SCHEME:-https}://${STOREFRONT_DOMAIN}
      FANCYPETS_STOREFRONT_URL: ${PUBLIC_SCHEME:-https}://${STOREFRONT_DOMAIN}
      S3_ENDPOINT: http://fancyperu-minio:9000
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-private}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FILE_URL: ${PUBLIC_SCHEME:-https}://${S3_DOMAIN}/${S3_BUCKET:-fancyperu-media}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?ORDER_TOKEN_SECRET is required}
      FINANCIAL_AUTHORIZED_ADMIN_EMAILS: ${FINANCIAL_AUTHORIZED_ADMIN_EMAILS}
      SHIPPING_MATRIX_JSON: ${SHIPPING_MATRIX_JSON}
      CULQI_ENABLED: ${CULQI_ENABLED:-false}
      CULQI_API_URL: ${CULQI_API_URL:-https://api.culqi.com/v2}
      CULQI_PUBLIC_KEY: ${CULQI_PUBLIC_KEY}
      CULQI_SECRET_KEY: ${CULQI_SECRET_KEY}
      CULQI_WEBHOOK_SECRET: ${CULQI_WEBHOOK_SECRET}
      CULQI_AUTO_CAPTURE: ${CULQI_AUTO_CAPTURE:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
    volumes:
      - fancyperu_uploads:/app/apps/backend/uploads
    networks:
      - fancyperu-internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.fancyperu-api.rule=Host(`${API_DOMAIN:?API_DOMAIN is required}`)"
      - "traefik.http.routers.fancyperu-api.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fancyperu-api.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.fancyperu-api.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}"
      - "traefik.http.services.fancyperu-api.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 768M }
        reservations: { memory: 320M }

  # ----------------------------------------------------------------------------
  # Next.js storefront
  # ----------------------------------------------------------------------------
  fancyperu-storefront:
    image: fancyperu-storefront:dokploy
    restart: unless-stopped
    depends_on:
      fancyperu-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      MEDUSA_BACKEND_URL: http://fancyperu-backend:9000
      MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: ${PUBLIC_SCHEME:-https}://${API_DOMAIN}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-pe}
      MEDUSA_DEFAULT_REGION: ${NEXT_PUBLIC_DEFAULT_REGION:-pe}
      ORDER_TOKEN_SECRET: ${ORDER_TOKEN_SECRET:?ORDER_TOKEN_SECRET is required}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-production}
      NEXT_PUBLIC_BASE_URL: ${PUBLIC_SCHEME:-https}://${STOREFRONT_DOMAIN}
    networks:
      - fancyperu-internal
      - dokploy-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/robots.txt"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }
    labels:
      - "traefik.enable=${TRAEFIK_ENABLE:-true}"
      - "traefik.docker.network=dokploy-network"
      - "traefik.http.routers.fancyperu-storefront.rule=Host(`${STOREFRONT_DOMAIN:?STOREFRONT_DOMAIN is required}`)"
      - "traefik.http.routers.fancyperu-storefront.entrypoints=${TRAEFIK_ENTRYPOINT:-websecure}"
      - "traefik.http.routers.fancyperu-storefront.tls=${TRAEFIK_TLS:-true}"
      - "traefik.http.routers.fancyperu-storefront.tls.certresolver=${TRAEFIK_CERTRESOLVER-letsencrypt}"
      - "traefik.http.services.fancyperu-storefront.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 512M }
        reservations: { memory: 160M }


