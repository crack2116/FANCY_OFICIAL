# Static host for the FancyPets animated admin panel.
# It is mounted into the panel container at /etc/nginx/conf.d/default.conf.
#
# Traefik sends only /panel and /hero/* here. The panel itself calls
# /auth, /admin and /store on the same origin, so those requests continue to
# the Medusa backend router.

server {
    listen 80;
    server_name _;

    root /srv;
    index index.html;

    # Main panel entrypoint.
    location = /panel {
        alias /srv/panel/index.html;
        default_type text/html;
        add_header Cache-Control "no-store, max-age=0";
        add_header X-Content-Type-Options "nosniff";
    }

    # Keep the trailing-slash variant working.
    location = /panel/ {
        return 301 /panel;
    }

    # Images used by the login screen and the carousel editor.
    location /hero/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Do not expose anything else from this container.
    location / {
        return 404;
    }
}
