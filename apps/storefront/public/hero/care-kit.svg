<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900" role="img" aria-labelledby="care-kit-title">
  <title id="care-kit-title">Kit de cuidado diario para mascotas</title>
  <defs>
    <linearGradient id="kitBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6faf4"/>
      <stop offset="0.55" stop-color="#eaf3ea"/>
      <stop offset="1" stop-color="#dbeadf"/>
    </linearGradient>
    <linearGradient id="bottleBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a7480"/>
      <stop offset="1" stop-color="#15525a"/>
    </linearGradient>
    <linearGradient id="bowlBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7b77b"/>
      <stop offset="1" stop-color="#e8913f"/>
    </linearGradient>
    <linearGradient id="towelBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/>
      <stop offset="1" stop-color="#f2e3cb"/>
    </linearGradient>
    <filter id="kitShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="kitSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>

  <rect width="1200" height="900" fill="url(#kitBg)"/>

  <!-- Soft brand shapes behind the flat lay -->
  <circle cx="600" cy="450" r="372" fill="#ffffff" fill-opacity="0.42"/>
  <circle cx="600" cy="450" r="372" fill="none" stroke="#ffffff" stroke-opacity="0.8" stroke-width="3"/>
  <circle cx="982" cy="196" r="84" fill="#f8c88f" fill-opacity="0.5"/>
  <circle cx="214" cy="214" r="40" fill="#ffffff" fill-opacity="0.55"/>

  <!-- Leaf sprig -->
  <g transform="translate(924 250) rotate(14)">
    <path d="M0 0 C 6 52 6 104 0 156" stroke="#3f7d5c" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M2 26 C 34 18 54 30 60 56 C 36 64 16 52 2 26Z" fill="#5d9a74"/>
    <path d="M2 60 C 34 52 54 64 60 90 C 36 98 16 86 2 60Z" fill="#4d8a66"/>
    <path d="M0 96 C -32 88 -52 100 -58 126 C -34 134 -14 122 0 96Z" fill="#5d9a74"/>
  </g>

  <!-- Shampoo bottle -->
  <g transform="translate(300 468) rotate(-7)">
    <ellipse cx="0" cy="176" rx="104" ry="24" fill="#0e3b3a" fill-opacity="0.18" filter="url(#kitShadow)"/>

    <!-- pump -->
    <rect x="-34" y="-196" width="68" height="40" rx="14" fill="#d97716"/>
    <rect x="-10" y="-238" width="20" height="52" rx="8" fill="#d97716"/>
    <path d="M10 -230 h58 a10 10 0 0 1 10 10 v10 a10 10 0 0 1 -10 10 h-58z" fill="#d97716"/>
    <rect x="-34" y="-196" width="68" height="12" rx="6" fill="#b95f0c" fill-opacity="0.45"/>

    <!-- neck + body -->
    <rect x="-30" y="-162" width="60" height="44" rx="10" fill="#124a52"/>
    <rect x="-86" y="-128" width="172" height="286" rx="40" fill="url(#bottleBody)"/>
    <path d="M-86 -86 h172" stroke="#ffffff" stroke-opacity="0.14" stroke-width="6"/>

    <!-- label -->
    <rect x="-62" y="-30" width="124" height="112" rx="18" fill="#fdf6ea"/>
    <path d="M-20 12 c8 -12 24 -12 32 0 c8 -12 24 -12 32 0" stroke="#a3510f" stroke-width="5" stroke-linecap="round" fill="none"/>
    <path d="M-22 38 c0 -12 88 -12 88 0 c0 20 -88 20 -88 0z" fill="#f2d9b8"/>
    <text x="0" y="66" text-anchor="middle" font-family="Verdana, sans-serif" font-size="17" font-weight="700" letter-spacing="1.5" fill="#15525a">CUIDADO</text>

    <!-- highlight -->
    <rect x="-64" y="-96" width="18" height="220" rx="9" fill="#ffffff" fill-opacity="0.16"/>
  </g>

  <!-- Brush -->
  <g transform="translate(604 432) rotate(24)">
    <ellipse cx="0" cy="196" rx="78" ry="18" fill="#0e3b3a" fill-opacity="0.16" filter="url(#kitShadow)"/>
    <rect x="-30" y="-36" width="60" height="228" rx="26" fill="#1d626b"/>
    <rect x="-30" y="120" width="60" height="18" rx="9" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="-88" y="-148" width="176" height="128" rx="46" fill="#15525a"/>
    <g stroke="#c9dde0" stroke-width="5" stroke-linecap="round" opacity="0.95">
      <path d="M-60 -116 v44"/>
      <path d="M-36 -120 v56"/>
      <path d="M-12 -122 v60"/>
      <path d="M12 -122 v60"/>
      <path d="M36 -120 v56"/>
      <path d="M60 -116 v44"/>
    </g>
    <rect x="-88" y="-148" width="176" height="128" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
  </g>

  <!-- Folded towel -->
  <g transform="translate(884 486) rotate(-6)">
    <ellipse cx="0" cy="118" rx="128" ry="22" fill="#0e3b3a" fill-opacity="0.14" filter="url(#kitShadow)"/>
    <rect x="-136" y="-76" width="272" height="168" rx="34" fill="url(#towelBody)"/>
    <path d="M-136 -22 h272" stroke="#e8c9a0" stroke-width="12"/>
    <path d="M-136 6 h272" stroke="#e8c9a0" stroke-width="5" opacity="0.7"/>
    <rect x="22" y="-76" width="114" height="168" rx="34" fill="#f4ddbd"/>
    <path d="M22 46 a34 34 0 0 1 34 -34 h80" stroke="#dfb98b" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="-136" y="-76" width="272" height="168" rx="34" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="4"/>
  </g>

  <!-- Food bowl -->
  <g transform="translate(368 706)">
    <ellipse cx="0" cy="46" rx="168" ry="30" fill="#0e3b3a" fill-opacity="0.16" filter="url(#kitShadow)"/>
    <path d="M-168 -18 a168 62 0 0 0 336 0 z" fill="url(#bowlBody)"/>
    <ellipse cx="0" cy="-18" rx="168" ry="62" fill="#ffd9ae"/>
    <ellipse cx="0" cy="-18" rx="138" ry="46" fill="#f6c184"/>
    <g fill="#b8702c">
      <circle cx="-74" cy="-24" r="13"/>
      <circle cx="-40" cy="-40" r="13"/>
      <circle cx="-4" cy="-26" r="13"/>
      <circle cx="32" cy="-40" r="13"/>
      <circle cx="68" cy="-24" r="13"/>
      <circle cx="-22" cy="-6" r="12"/>
      <circle cx="18" cy="-8" r="12"/>
      <circle cx="52" cy="-4" r="11"/>
    </g>
    <path d="M-168 -18 a168 62 0 0 0 336 0" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
    <path d="M-132 34 a132 34 0 0 0 264 0" fill="none" stroke="#b95f0c" stroke-opacity="0.25" stroke-width="6"/>
    <text x="0" y="26" text-anchor="middle" font-family="Verdana, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#8a4413" opacity="0.8">FANCY</text>
  </g>

  <!-- Toothbrush -->
  <g transform="translate(770 726) rotate(-16)">
    <ellipse cx="0" cy="26" rx="86" ry="14" fill="#0e3b3a" fill-opacity="0.12" filter="url(#kitSoft)"/>
    <rect x="-96" y="-13" width="150" height="26" rx="13" fill="#1d626b"/>
    <rect x="54" y="-19" width="86" height="38" rx="18" fill="#15525a"/>
    <g fill="#fdf6ea">
      <rect x="64" y="-32" width="8" height="16" rx="4"/>
      <rect x="78" y="-34" width="8" height="16" rx="4"/>
      <rect x="92" y="-34" width="8" height="16" rx="4"/>
      <rect x="106" y="-32" width="8" height="16" rx="4"/>
    </g>
    <circle cx="-70" cy="0" r="9" fill="#f7b77b"/>
  </g>

  <!-- Small paw prints -->
  <g fill="#15525a" opacity="0.14">
    <g transform="translate(178 594) scale(1.1)">
      <ellipse cx="0" cy="16" rx="17" ry="14"/>
      <ellipse cx="-19" cy="-6" rx="7" ry="9"/>
      <ellipse cx="-6" cy="-15" rx="7" ry="9"/>
      <ellipse cx="8" cy="-15" rx="7" ry="9"/>
      <ellipse cx="20" cy="-5" rx="7" ry="9"/>
    </g>
    <g transform="translate(1044 612) rotate(18) scale(0.85)">
      <ellipse cx="0" cy="16" rx="17" ry="14"/>
      <ellipse cx="-19" cy="-6" rx="7" ry="9"/>
      <ellipse cx="-6" cy="-15" rx="7" ry="9"/>
      <ellipse cx="8" cy="-15" rx="7" ry="9"/>
      <ellipse cx="20" cy="-5" rx="7" ry="9"/>
    </g>
  </g>
</svg>
