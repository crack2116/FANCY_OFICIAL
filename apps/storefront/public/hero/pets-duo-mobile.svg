<svg xmlns="http://www.w3.org/2000/svg" viewBox="150 170 900 675" width="900" height="675" role="img" aria-labelledby="hero-duo-title">
  <title id="hero-duo-title">Perro y gato sentados juntos</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fffaf2"/>
      <stop offset="0.55" stop-color="#fdf3e4"/>
      <stop offset="1" stop-color="#f5e5cf"/>
    </linearGradient>
    <linearGradient id="arch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9f3ee"/>
      <stop offset="1" stop-color="#d3e7e0"/>
    </linearGradient>
    <linearGradient id="dog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a066"/>
      <stop offset="1" stop-color="#c07f3f"/>
    </linearGradient>
    <linearGradient id="dogEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b97b3d"/>
      <stop offset="1" stop-color="#9c612c"/>
    </linearGradient>
    <linearGradient id="cat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dabb4"/>
      <stop offset="1" stop-color="#7d8c97"/>
    </linearGradient>
    <linearGradient id="catEar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b99a3"/>
      <stop offset="1" stop-color="#75848f"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d626b"/>
      <stop offset="1" stop-color="#124a52"/>
    </linearGradient>
    <filter id="shadowBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <clipPath id="frame">
      <rect width="1200" height="900" rx="0"/>
    </clipPath>
    <g id="paw" fill="#15525a">
      <ellipse cx="0" cy="16" rx="17" ry="14"/>
      <ellipse cx="-19" cy="-6" rx="7" ry="9" transform="rotate(-18 -19 -6)"/>
      <ellipse cx="-6" cy="-15" rx="7" ry="9" transform="rotate(-6 -6 -15)"/>
      <ellipse cx="8" cy="-15" rx="7" ry="9" transform="rotate(6 8 -15)"/>
      <ellipse cx="20" cy="-5" rx="7" ry="9" transform="rotate(18 20 -5)"/>
    </g>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="900" fill="url(#bg)"/>

    <!-- Soft brand arch behind the pets -->
    <circle cx="625" cy="410" r="336" fill="url(#arch)"/>
    <circle cx="625" cy="410" r="336" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
    <circle cx="905" cy="190" r="96" fill="#f8c88f" fill-opacity="0.45"/>
    <circle cx="352" cy="170" r="46" fill="#ffffff" fill-opacity="0.5"/>

    <!-- Decorative paw prints -->
    <g opacity="0.1">
      <use href="#paw" transform="translate(190 620) rotate(-18) scale(1.25)"/>
      <use href="#paw" transform="translate(1015 655) rotate(16) scale(1.1)"/>
      <use href="#paw" transform="translate(935 300) rotate(24) scale(0.8)"/>
      <use href="#paw" transform="translate(268 330) rotate(-10) scale(0.7)"/>
    </g>

    <!-- Ground shadow -->
    <ellipse cx="620" cy="808" rx="392" ry="52" fill="#c9a878" opacity="0.26" filter="url(#shadowBlur)"/>

    <!-- Plant sprigs -->
    <g stroke="#6f9275" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.9">
      <path d="M1050 800c-6-88 8-158 34-214"/>
      <path d="M1084 586c26 6 42 26 46 54-26 2-44-16-46-54Z" fill="#8fb18f" stroke="none"/>
      <path d="M1074 664c-30-2-50 12-58 40 26 8 52-8 58-40Z" fill="#a3bf9b" stroke="none"/>
      <path d="M1058 736c28 4 46 22 50 50-26 4-46-14-50-50Z" fill="#8fb18f" stroke="none"/>
    </g>
    <g stroke="#6f9275" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.7">
      <path d="M150 800c4-62-2-112-20-152"/>
      <path d="M130 648c-22 2-36 18-40 42 22 2 38-14 40-42Z" fill="#a3bf9b" stroke="none"/>
      <path d="M140 712c24 0 38 14 42 38-22 2-38-12-42-38Z" fill="#8fb18f" stroke="none"/>
    </g>

    <!-- ================= DOG ================= -->
    <g>
      <!-- tail -->
      <path d="M638 760c58-6 84-46 74-92" fill="none" stroke="#c07f3f" stroke-width="34" stroke-linecap="round"/>

      <!-- body -->
      <path d="M342 796c-14-84-2-166 34-222 26-40 62-62 100-62s74 22 100 62c36 56 48 138 34 222Z" fill="url(#dog)"/>
      <!-- chest -->
      <path d="M420 796c-8-66-2-130 18-172 14-30 30-46 48-46s34 16 48 46c20 42 26 106 18 172Z" fill="#f7ead8" opacity="0.95"/>
      <!-- front legs -->
      <rect x="408" y="686" width="62" height="118" rx="31" fill="#d99a5d"/>
      <rect x="512" y="686" width="62" height="118" rx="31" fill="#d99a5d"/>
      <ellipse cx="439" cy="800" rx="44" ry="22" fill="#f0dcc2"/>
      <ellipse cx="543" cy="800" rx="44" ry="22" fill="#f0dcc2"/>
      <g stroke="#c99a63" stroke-width="5" stroke-linecap="round" opacity="0.55">
        <path d="M424 794v10M439 792v12M454 794v10"/>
        <path d="M528 794v10M543 792v12M558 794v10"/>
      </g>

      <!-- ears -->
      <path d="M372 336c-46-30-86 2-92 62-6 54 10 108 46 128 22 12 40 4 46-14-18-52-16-112 0-176Z" fill="url(#dogEar)"/>
      <path d="M608 336c46-30 86 2 92 62 6 54-10 108-46 128-22 12-40 4-46-14 18-52 16-112 0-176Z" fill="url(#dogEar)"/>

      <!-- head -->
      <circle cx="490" cy="410" r="152" fill="url(#dog)"/>
      <path d="M490 258c70 0 126 44 145 108-30-36-82-58-145-58s-115 22-145 58c19-64 75-108 145-108Z" fill="#e5b47c" opacity="0.55"/>

      <!-- eyebrows -->
      <circle cx="432" cy="356" r="9" fill="#f7ead8"/>
      <circle cx="548" cy="356" r="9" fill="#f7ead8"/>

      <!-- eyes -->
      <ellipse cx="432" cy="396" rx="15" ry="17" fill="#2b211a"/>
      <ellipse cx="548" cy="396" rx="15" ry="17" fill="#2b211a"/>
      <circle cx="437" cy="390" r="5" fill="#ffffff"/>
      <circle cx="553" cy="390" r="5" fill="#ffffff"/>

      <!-- muzzle -->
      <ellipse cx="490" cy="472" rx="98" ry="76" fill="#f9eddb"/>
      <path d="M490 428c16 0 30 8 30 22s-14 24-30 24-30-10-30-24 14-22 30-22Z" fill="#5d3a21"/>
      <path d="M490 474v16" stroke="#7a4a25" stroke-width="7" stroke-linecap="round"/>
      <path d="M490 490c-4 16-18 24-34 20" stroke="#7a4a25" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M490 490c4 16 18 24 34 20" stroke="#7a4a25" stroke-width="7" stroke-linecap="round" fill="none"/>
      <path d="M476 502c0 18 6 30 14 30s14-12 14-30Z" fill="#e8838f"/>

      <!-- collar -->
      <path d="M382 548c34 26 70 38 108 38s74-12 108-38l14 30c-38 30-78 44-122 44s-84-14-122-44Z" fill="#15525a"/>
      <circle cx="490" cy="626" r="21" fill="#f3b75b"/>
      <circle cx="490" cy="626" r="10" fill="#15525a"/>
    </g>

    <!-- ================= CAT ================= -->
    <g>
      <!-- tail -->
      <path d="M905 780c62 10 100-18 100-66 0-34-18-58-44-62" fill="none" stroke="#7d8c97" stroke-width="30" stroke-linecap="round"/>

      <!-- body -->
      <path d="M700 800c-10-70 0-136 30-180 20-30 46-46 76-46s56 16 76 46c30 44 40 110 30 180Z" fill="url(#cat)"/>
      <!-- chest -->
      <path d="M762 800c-6-52 0-102 14-136 10-24 20-36 30-36s20 12 30 36c14 34 20 84 14 136Z" fill="#f1ece4"/>
      <rect x="742" y="700" width="50" height="104" rx="25" fill="#8b99a3"/>
      <rect x="820" y="700" width="50" height="104" rx="25" fill="#8b99a3"/>
      <ellipse cx="767" cy="802" rx="34" ry="17" fill="#efe9e0"/>
      <ellipse cx="845" cy="802" rx="34" ry="17" fill="#efe9e0"/>

      <!-- ears -->
      <path d="M712 424c-26-22-42-52-40-86 34 4 62 24 80 56Z" fill="url(#catEar)"/>
      <path d="M888 424c26-22 42-52 40-86-34 4-62 24-80 56Z" fill="url(#catEar)"/>
      <path d="M718 402c-14-14-22-30-24-44 16 6 30 18 40 34Z" fill="#e8a7ae"/>
      <path d="M882 402c14-14 22-30 24-44-16 6-30 18-40 34Z" fill="#e8a7ae"/>

      <!-- head -->
      <circle cx="800" cy="470" r="124" fill="url(#cat)"/>
      <path d="M800 346c54 0 98 34 115 82-26-24-68-38-115-38s-89 14-115 38c17-48 61-82 115-82Z" fill="#b3bfc7" opacity="0.45"/>

      <!-- eyes -->
      <path d="M738 458c12-14 32-14 44 0-12 14-32 14-44 0Z" fill="#7fae8c"/>
      <path d="M818 458c12-14 32-14 44 0-12 14-32 14-44 0Z" fill="#7fae8c"/>
      <path d="M758 451c2 4 4 8 4 14h-8c0-6 2-10 4-14Z" fill="#2f3b35"/>
      <path d="M838 451c2 4 4 8 4 14h-8c0-6 2-10 4-14Z" fill="#2f3b35"/>
      <circle cx="748" cy="455" r="3.5" fill="#ffffff"/>
      <circle cx="828" cy="455" r="3.5" fill="#ffffff"/>

      <!-- muzzle -->
      <ellipse cx="800" cy="524" rx="54" ry="40" fill="#f2ede5" opacity="0.85"/>
      <path d="M800 500c9 0 16 5 16 12s-7 12-16 12-16-5-16-12 7-12 16-12Z" fill="#e79aa3"/>
      <path d="M800 524v10" stroke="#6b5a52" stroke-width="5" stroke-linecap="round"/>
      <path d="M800 534c-3 12-12 18-22 14M800 534c3 12 12 18 22 14" stroke="#6b5a52" stroke-width="5" stroke-linecap="round" fill="none"/>
      <g stroke="#5f6d74" stroke-width="4" stroke-linecap="round" opacity="0.45">
        <path d="M742 514h-52M744 528l-50 10M748 542l-42 18"/>
        <path d="M858 514h52M856 528l50 10M852 542l42 18"/>
      </g>

      <!-- collar -->
      <path d="M708 586c28 20 58 30 92 30s64-10 92-30l10 26c-32 24-66 36-102 36s-70-12-102-36Z" fill="#e08a3c"/>
      <circle cx="800" cy="650" r="16" fill="#15525a"/>
      <path d="M800 642v16M792 650h16" stroke="#f3b75b" stroke-width="4" stroke-linecap="round"/>
    </g>

    <!-- ================= BOWL ================= -->
    <g>
      <ellipse cx="285" cy="806" rx="128" ry="22" fill="#c9a878" opacity="0.35" filter="url(#softBlur)"/>
      <path d="M190 758h190c-6 44-42 66-95 66s-89-22-95-66Z" fill="url(#bowl)"/>
      <ellipse cx="285" cy="758" rx="95" ry="24" fill="#2a737d"/>
      <ellipse cx="285" cy="755" rx="82" ry="17" fill="#0e3e45"/>
      <g fill="#e7b877">
        <circle cx="252" cy="752" r="9"/>
        <circle cx="276" cy="746" r="9"/>
        <circle cx="300" cy="751" r="9"/>
        <circle cx="320" cy="757" r="8"/>
        <circle cx="263" cy="760" r="8"/>
      </g>
      <use href="#paw" transform="translate(285 792) scale(0.72)" fill="#f7ead8" opacity="0.9"/>
    </g>

    <!-- small hearts -->
    <g fill="#e08a3c" opacity="0.75">
      <path d="M905 372c-7-8-20-6-24 3-4-9-17-11-24-3-8 9-2 20 24 35 26-15 32-26 24-35Z" transform="translate(0 -6) scale(0.7)"/>
    </g>
    <g fill="#15525a" opacity="0.35">
      <path d="M348 250c-6-7-17-5-20 3-3-8-14-10-20-3-7 8-2 17 20 29 22-12 27-21 20-29Z" transform="scale(0.8)"/>
    </g>
  </g>
</svg>
