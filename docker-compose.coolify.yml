# ==============================================================================
# FANCYPERU — Production Docker Compose Specification for Coolify
# Target Host: servidor-1 (192.168.1.36)
# Reverse Proxy: Traefik (Coolify-managed external network: coolify)
# Isolation: Dedicated isolated internal stack (Option B Architecture)
# ==============================================================================

version: "3.8"

networks:
  # Internal bridge network strictly for FANCYPERU inter-container communication
  fancyperu-internal:
    driver: bridge
    name: fancyperu-internal
  # Coolify external Traefik network for public HTTPS ingress
  coolify:
    external: true

volumes:
  fancyperu_db_data:
    name: fancyperu_db_data
  fancyperu_redis_data:
    name: fancyperu_redis_data
  fancyperu_minio_data:
    name: fancyperu_minio_data
  fancyperu_uploads:
    name: fancyperu_uploads

services:
  # ----------------------------------------------------------------------------
  # 1. PostgreSQL 16 Database (Isolated Option B)
  # ----------------------------------------------------------------------------
  fancyperu-db:
    image: postgres:16-alpine
    container_name: fancyperu-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fancyperu_prod}
      POSTGRES_USER: ${POSTGRES_USER:-fancyperu_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - fancyperu_db_data:/var/lib/postgresql/data
    networks:
      - fancyperu-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-fancyperu_admin} -d $${POSTGRES_DB:-fancyperu_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 2. Redis 7 (Event Bus, Workflow Engine, Distributed Locks, Caching)
  # ----------------------------------------------------------------------------
  fancyperu-redis:
    image: redis:7-alpine
    container_name: fancyperu-redis
    restart: unless-stopped
    command: >
      redis-server 
      --requirepass ${REDIS_PASSWORD} 
      --appendonly yes 
      --maxmemory 256mb 
      --maxmemory-policy noeviction
    volumes:
      - fancyperu_redis_data:/data
    networks:
      - fancyperu-internal
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M

  # ----------------------------------------------------------------------------
  # 3. MinIO S3-Compatible Storage (Dedicated Instance)
  # Note: Admin Console is bound to private localhost:9001 only (NOT public Traefik)
  # ----------------------------------------------------------------------------
  fancyperu-minio:
    image: ghcr.io/coollabsio/minio:RELEASE.2025-10-15T17-29-55Z
    container_name: fancyperu-minio
    restart: unless-stopped
    command: server /data --console-address "127.0.0.1:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_SERVER_URL: https://${MINIO_API_DOMAIN:-s3.fancyperu.com}
    volumes:
      - fancyperu_minio_data:/data
    networks:
      - fancyperu-internal
      - coolify
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    labels:
      - "traefik.enable=true"
      # S3 API Public Router (Port 9000 ONLY)
      - "traefik.http.routers.fancyperu-s3.rule=Host(`${MINIO_API_DOMAIN:-s3.fancyperu.com}`)"
      - "traefik.http.routers.fancyperu-s3.entrypoints=https"
      - "traefik.http.routers.fancyperu-s3.tls=true"
      - "traefik.http.routers.fancyperu-s3.tls.certresolver=letsencrypt"
      - "traefik.http.services.fancyperu-s3.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          memory: 128M

  # ----------------------------------------------------------------------------
  # 4. Medusa 2 Database Migration One-Shot Runner
  # Guarantees migrations run and finish successfully before backend starts
  # ----------------------------------------------------------------------------
  fancyperu-migration:
    image: ${BACKEND_IMAGE:-fancyperu-backend:production-2.21.2-20261016}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fancyperu-migration
    restart: "no"
    depends_on:
      fancyperu-db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_admin}:${POSTGRES_PASSWORD}@fancyperu-db:5432/${POSTGRES_DB:-fancyperu_prod}?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_ENDPOINT: http://fancyperu-minio:9000
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
    command: ["node", "../../node_modules/@medusajs/cli/cli.js", "db:migrate"]
    networks:
      - fancyperu-internal

  # ----------------------------------------------------------------------------
  # 5. Medusa 2.21.2 Backend API & Admin Dashboard
  # ----------------------------------------------------------------------------
  fancyperu-backend:
    image: ${BACKEND_IMAGE:-fancyperu-backend:production-2.21.2-20261016}
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    container_name: fancyperu-backend
    restart: unless-stopped
    depends_on:
      fancyperu-db:
        condition: service_healthy
      fancyperu-redis:
        condition: service_healthy
      fancyperu-migration:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 9000
      DATABASE_URL: postgres://${POSTGRES_USER:-fancyperu_admin}:${POSTGRES_PASSWORD}@fancyperu-db:5432/${POSTGRES_DB:-fancyperu_prod}?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@fancyperu-redis:6379
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECRET: ${COOKIE_SECRET}
      MEDUSA_FF_RBAC: "true"
      STORE_CORS: ${STORE_CORS:-https://tienda.fancyperu.com}
      ADMIN_CORS: ${ADMIN_CORS:-https://admin.fancyperu.com,https://api.fancyperu.com}
      AUTH_CORS: ${AUTH_CORS:-https://tienda.fancyperu.com,https://admin.fancyperu.com,https://api.fancyperu.com}
      MEDUSA_BACKEND_URL: https://${MEDUSA_BACKEND_DOMAIN:-api.fancyperu.com}
      # Dedicated S3 File Provider Integration
      S3_ENDPOINT: http://fancyperu-minio:9000
      S3_BUCKET: ${S3_BUCKET:-fancyperu-media}
      S3_PRIVATE_BUCKET: ${S3_PRIVATE_BUCKET:-fancyperu-private}
      S3_REGION: us-east-1
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_FILE_URL: https://${MINIO_API_DOMAIN:-s3.fancyperu.com}/${S3_BUCKET:-fancyperu-media}
    volumes:
      - fancyperu_uploads:/app/apps/backend/uploads
    networks:
      - fancyperu-internal
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:9000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fancyperu-backend.rule=Host(`${MEDUSA_BACKEND_DOMAIN:-api.fancyperu.com}`)"
      - "traefik.http.routers.fancyperu-backend.entrypoints=https"
      - "traefik.http.routers.fancyperu-backend.tls=true"
      - "traefik.http.routers.fancyperu-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.fancyperu-backend.loadbalancer.server.port=9000"
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 768M
        reservations:
          memory: 350M

  # ----------------------------------------------------------------------------
  # 6. Next.js 15 Storefront
  # ----------------------------------------------------------------------------
  fancyperu-storefront:
    image: ${STOREFRONT_IMAGE:-fancyperu-storefront:production-15.5.24-20261016}
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
      args:
        NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${MEDUSA_BACKEND_DOMAIN:-api.fancyperu.com}
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
    container_name: fancyperu-storefront
    restart: unless-stopped
    depends_on:
      fancyperu-backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8000
      MEDUSA_BACKEND_URL: http://fancyperu-backend:9000
      MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_MEDUSA_BACKEND_URL: https://${MEDUSA_BACKEND_DOMAIN:-api.fancyperu.com}
      NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
      NEXT_PUBLIC_DEFAULT_REGION: pe
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    networks:
      - fancyperu-internal
      - coolify
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.fancyperu-storefront.rule=Host(`${STOREFRONT_DOMAIN:-tienda.fancyperu.com}`)"
      - "traefik.http.routers.fancyperu-storefront.entrypoints=https"
      - "traefik.http.routers.fancyperu-storefront.tls=true"
      - "traefik.http.routers.fancyperu-storefront.tls.certresolver=letsencrypt"
      - "traefik.http.services.fancyperu-storefront.loadbalancer.server.port=8000"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 150M
